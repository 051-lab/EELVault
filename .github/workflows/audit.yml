name: Audit

on:
  push:
    branches: [main, dragon-adaptive-control-experiments]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: audit-${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [anima, dragon, materialmemory, soloconsole, stillroom]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ${{ matrix.package }} audit
        run: python3 tools/audit_${{ matrix.package }}.py

  dragon-device-preflight:
    name: dragon-device-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run production Dragon regression audit
        run: python3 tools/audit_dragon.py
      - name: Run Dragon device-candidate preflight
        run: python3 tools/audit_dragon_device_candidates.py
